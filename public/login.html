<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 — 远远的天空</title>
  <link rel="preconnect" href="https://fonts.googleapis.cn">
  <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
  <link href="https://fonts.googleapis.cn/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--night-3) 0%,var(--night-2) 60%,var(--night-1) 100%);color:var(--night-ink);overflow:hidden}
    .stars-bg{position:fixed;inset:0;pointer-events:none}
    .star{position:absolute;background:#fff;border-radius:50%;opacity:0.7}
    .star.tw{animation:twinkle var(--td,3s) ease-in-out infinite}
    @keyframes twinkle{0%,100%{opacity:0.25;transform:scale(0.8)}50%{opacity:1;transform:scale(1.3)}}

    .login-box{position:relative;z-index:2;width:100%;max-width:400px;margin:24px;padding:44px 36px;background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);border-radius:24px;text-align:center}
    .login-box svg.logo{width:40px;height:40px;margin-bottom:16px;color:var(--gold-soft)}
    .login-box h1{font-family:var(--serif);font-size:1.8rem;font-weight:700;color:#fff;margin-bottom:6px}
    .login-box .sub{font-size:0.82rem;color:var(--text-dim);margin-bottom:32px}
    .field{margin-bottom:18px;text-align:left}
    .field label{display:block;font-size:0.78rem;color:var(--text-dim);margin-bottom:6px;letter-spacing:0.05em}
    .field input{width:100%;padding:13px 18px;font-size:0.95rem;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:100px;color:#fff;outline:none;font-family:var(--serif);transition:border-color 0.3s}
    .field input::placeholder{color:var(--text-faint)}
    .field input:focus{border-color:var(--gold-soft)}
    .btn{width:100%;padding:14px;font-size:0.95rem;font-family:var(--serif);background:var(--gold);color:#1a1206;border:none;border-radius:100px;cursor:pointer;font-weight:600;transition:all 0.3s;margin-top:8px}
    .btn:hover{background:var(--gold-soft);transform:translateY(-1px)}
    .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
    .error{color:#f08080;font-size:0.8rem;margin-top:12px;min-height:20px}
    .back{display:inline-block;margin-top:24px;font-size:0.82rem;color:var(--text-faint);transition:color 0.3s}
    .back:hover{color:var(--gold-soft)}
  </style>
</head>
<body>

  <div class="stars-bg" id="stars"></div>

  <div class="login-box">
    <svg class="logo" viewBox="0 0 32 32" fill="none"><path d="M22 18a5 5 0 0 0-9.8-1.4A4 4 0 0 0 6 20.5 4.5 4.5 0 0 0 10.5 25H22a4 4 0 0 0 0-8z" fill="currentColor"></path><circle cx="24" cy="9" r="3.5" fill="currentColor" opacity="0.7"></circle></svg>
    <h1>登录后台</h1>
    <p class="sub">管理这片天空</p>
    <form id="loginForm">
      <div class="field"><label>用户名</label><input type="text" id="username" placeholder="输入用户名" autocomplete="username" required></div>
      <div class="field"><label>密码</label><input type="password" id="password" placeholder="输入密码" autocomplete="current-password" required></div>
      <button type="submit" class="btn" id="loginBtn">登录</button>
      <div class="error" id="error" role="alert"></div>
    </form>
    <a href="index.html" class="back">← 回到天空</a>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    // 星空背景
    (function () {
      const box = document.getElementById('stars');
      const frag = document.createDocumentFragment();
      for (let i = 0; i < 70; i++) {
        const s = document.createElement('span');
        s.className = 'star' + (Math.random() > 0.4 ? ' tw' : '');
        const sz = (Math.random() * 2 + 0.5).toFixed(1);
        s.style.cssText = `left:${(Math.random() * 100).toFixed(2)}%;top:${(Math.random() * 100).toFixed(2)}%;width:${sz}px;height:${sz}px;--td:${(Math.random() * 3 + 2).toFixed(1)}s;animation-delay:${(Math.random() * 3).toFixed(1)}s`;
        frag.appendChild(s);
      }
      box.appendChild(frag);
    })();

    if (API.isAuthed()) window.location.href = 'admin/index.html';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('error');
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      if (!u || !p) { err.textContent = '请输入用户名和密码'; return; }
      btn.disabled = true; btn.textContent = '登录中……'; err.textContent = '';
      try {
        await API.login(u, p);
        window.location.href = 'admin/index.html';
      } catch (ex) {
        err.textContent = ex.message || '登录失败';
        btn.disabled = false; btn.textContent = '登录';
      }
    });
  </script>
</body>
</html>
