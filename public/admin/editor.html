<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑文章 — 远远的天空</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--sans);background:var(--cream);color:var(--day-ink);min-height:100vh}
    a{color:inherit;text-decoration:none}
    ::selection{background:var(--gold);color:#fff}

    .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,0.06);padding:12px 0}
    .topbar-inner{max-width:var(--max);margin:0 auto;padding:0 40px;display:flex;align-items:center;gap:14px}
    .topbar-back{font-size:0.88rem;color:var(--taupe);display:flex;align-items:center;gap:5px;transition:color 0.3s}
    .topbar-back:hover{color:var(--day-ink)}
    .topbar-back svg{width:16px;height:16px}
    .topbar-title{font-family:var(--serif);font-weight:700;font-size:1rem}
    .topbar-actions{margin-left:auto;display:flex;gap:8px}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:100px;font-size:0.85rem;font-family:var(--sans);cursor:pointer;transition:all 0.3s;border:none}
    .btn-primary{background:var(--day-ink);color:var(--day-1)}
    .btn-primary:hover{background:var(--day-deep)}
    .btn-outline{background:transparent;border:1px solid rgba(0,0,0,0.15);color:var(--day-ink)}
    .btn-outline:hover{background:rgba(0,0,0,0.04)}
    .btn-save{background:var(--gold);color:#1a1206}
    .btn-save:hover{background:var(--gold-soft)}

    .editor-wrap{max-width:var(--max);margin:0 auto;padding:32px 40px 80px;display:grid;grid-template-columns:1fr 320px;gap:32px}
    .editor-main{display:flex;flex-direction:column;gap:20px}
    .editor-main input,.editor-main textarea{width:100%;font-family:var(--serif);font-size:1rem;padding:14px 18px;border:1px solid rgba(0,0,0,0.1);border-radius:12px;background:#fff;outline:none;transition:border-color 0.3s;resize:vertical}
    .editor-main input:focus,.editor-main textarea:focus{border-color:var(--day-deep)}
    .editor-main input.title-input{font-size:1.5rem;font-weight:700;padding:16px 20px}
    .editor-main textarea{min-height:400px;line-height:1.8;font-size:0.95rem}

    .editor-side{display:flex;flex-direction:column;gap:20px}
    .side-card{background:#fff;border-radius:14px;padding:20px;border:1px solid rgba(0,0,0,0.06)}
    .side-card h4{font-size:0.78rem;letter-spacing:0.05em;color:var(--taupe);margin-bottom:14px;text-transform:uppercase}
    .side-card input,.side-card select{width:100%;padding:10px 14px;border:1px solid rgba(0,0,0,0.1);border-radius:10px;font-size:0.88rem;font-family:var(--sans);outline:none;margin-bottom:10px}
    .side-card label{display:block;font-size:0.78rem;color:var(--taupe);margin-bottom:4px}

    .preview-panel{position:fixed;top:0;right:0;bottom:0;width:50%;background:#fff;z-index:60;box-shadow:-10px 0 40px rgba(0,0,0,0.15);overflow-y:auto;padding:40px;transform:translateX(100%);transition:transform 0.4s var(--ease)}
    .preview-panel.open{transform:translateX(0)}
    .preview-close{position:absolute;top:20px;right:20px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;font-size:1.2rem}
    .preview-content{font-family:var(--serif);font-size:1rem;line-height:2}
    .preview-content h1,.preview-content h2,.preview-content h3{margin:1.5em 0 0.5em}
    .preview-content p{margin:0.8em 0}
    .preview-content ul{margin:0.8em 0;padding-left:1.5em}

    @media(max-width:860px){
      .editor-wrap{grid-template-columns:1fr;padding:20px 16px 60px}
      .topbar-inner{padding:0 16px}
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="posts.html" class="topbar-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>返回</a>
      <span class="topbar-title" id="pageTitle">写新文章</span>
      <div class="topbar-actions">
        <button class="btn btn-outline" id="previewBtn">预览</button>
        <button class="btn btn-outline" id="saveDraftBtn">保存草稿</button>
        <button class="btn btn-save" id="publishBtn">发布</button>
      </div>
    </div>
  </header>

  <div class="editor-wrap">
    <div class="editor-main">
      <input type="text" class="title-input" id="title" placeholder="文章标题">
      <textarea id="content" placeholder="正文（Markdown）……"></textarea>
    </div>
    <div class="editor-side">
      <div class="side-card">
        <h4>发布设置</h4>
        <label>日期</label>
        <input type="date" id="date">
        <label>封面图 URL</label>
        <input type="text" id="cover" placeholder="images/xxx.jpg">
      </div>
      <div class="side-card">
        <h4>分类与标签</h4>
        <label>分类</label>
        <select id="categoryId"></select>
        <label>标签（逗号分隔）</label>
        <input type="text" id="tag" placeholder="例如：旅行,云海,秋天">
      </div>
      <div class="side-card">
        <h4>摘要</h4>
        <textarea id="excerpt" rows="3" style="width:100%;border:1px solid rgba(0,0,0,0.1);border-radius:10px;padding:10px;font-family:var(--sans);font-size:0.85rem;resize:vertical;outline:none" placeholder="简短摘要……"></textarea>
      </div>
    </div>
  </div>

  <!-- 预览面板 -->
  <div class="preview-panel" id="previewPanel">
    <button class="preview-close" id="previewClose">✕</button>
    <div class="preview-content" id="previewContent"></div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/md.js"></script>
  <script>
    if(!API.isAuthed()){ window.location.href = '../login.html'; }

    const params = new URLSearchParams(location.search);
    const editId = params.get('id') ? +params.get('id') : null;

    // 加载分类
    async function loadCats(){
      const cats = await API.getCategories();
      const sel = document.getElementById('categoryId');
      sel.innerHTML = '<option value="">未分类</option>' + cats.filter(c=>c.name!=='全部').map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }
    loadCats();

    // 如果是编辑，加载文章
    (async function(){
      if(editId){
        try {
          const post = await API.getPost(editId);
          document.getElementById('pageTitle').textContent = '编辑文章';
          document.getElementById('title').value = post.title || '';
          document.getElementById('content').value = post.content || '';
          document.getElementById('date').value = post.date || '';
          document.getElementById('cover').value = post.cover || '';
          document.getElementById('tag').value = post.tag || '';
          document.getElementById('excerpt').value = post.excerpt || '';
          if(post.categoryId) document.getElementById('categoryId').value = post.categoryId;
        } catch(e){ UI.toast('加载文章失败: '+e.message); }
      }
    })();

    // 收集表单
    function getFormData(){
      return {
        title: document.getElementById('title').value.trim(),
        content: document.getElementById('content').value.trim(),
        date: document.getElementById('date').value || new Date().toISOString().substring(0,10),
        cover: document.getElementById('cover').value.trim(),
        tag: document.getElementById('tag').value.trim(),
        excerpt: document.getElementById('excerpt').value.trim(),
        categoryId: document.getElementById('categoryId').value ? +document.getElementById('categoryId').value : null
      };
    }

    async function save(status){
      const data = getFormData();
      if(!data.title){ UI.toast('标题不能为空'); return; }
      if(!data.content){ UI.toast('正文不能为空'); return; }
      data.status = status;
      data.slug = data.title.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').toLowerCase();
      try {
        if(editId){
          await API.updatePost(editId, data);
        } else {
          await API.createPost(data);
        }
        UI.toast(status==='pub'?'已发布':'已保存草稿');
        setTimeout(()=>{ window.location.href = 'posts.html'; }, 500);
      } catch(e){ UI.toast('保存失败: '+e.message); }
    }

    document.getElementById('publishBtn').addEventListener('click',()=>save('pub'));
    document.getElementById('saveDraftBtn').addEventListener('click',()=>save('draft'));

    // 预览
    const previewPanel = document.getElementById('previewPanel');
    document.getElementById('previewBtn').addEventListener('click',()=>{
      const data = getFormData();
      document.getElementById('previewContent').innerHTML = `
        <h1>${data.title||'无标题'}</h1>
        <p style="color:var(--taupe);font-size:0.9rem">${data.date} ${data.tag?'· '+data.tag:''}</p>
        ${data.cover?`<img src="${data.cover}" style="max-width:100%;border-radius:12px;margin:20px 0">`:''}
        ${MD.render(data.content)}
      `;
      previewPanel.classList.add('open');
    });
    document.getElementById('previewClose').addEventListener('click',()=>{
      previewPanel.classList.remove('open');
    });
  </script>
</body>
</html>
