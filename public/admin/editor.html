<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑文章 — 远远的天空</title>
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../js/codemirror.min.css">
  <link rel="stylesheet" href="../js/easymde.min.css">
  <script src="../js/vendor/tailwind4.js"></script>
  <script src="../js/vendor/lucide.js"></script>
  <style type="text/tailwindcss">
    @theme inline {
      --color-warm-bg: var(--warm-bg); --color-warm-surface: var(--warm-surface);
      --color-warm-surface-2: var(--warm-surface-2); --color-warm-surface-3: var(--warm-surface-3);
      --color-warm-ink: var(--warm-ink); --color-warm-ink-2: var(--warm-ink-2); --color-warm-ink-3: var(--warm-ink-3);
      --color-warm-brand: var(--warm-brand); --color-warm-brand-50: var(--warm-brand-50);
      --color-warm-brand-100: var(--warm-brand-100); --color-warm-brand-300: var(--warm-brand-300);
      --color-warm-brand-500: var(--warm-brand-500); --color-warm-brand-600: var(--warm-brand-600);
      --color-warm-line: var(--warm-line);
      --radius-warm-md: var(--warm-radius-medium); --radius-warm-lg: var(--warm-radius-large);
    }
  </style>
  <style>
    /* EasyMDE 主题适配温暖色系 */
    .EasyMDEContainer { background: var(--warm-surface); border-radius: var(--warm-radius-large); border: 1px solid var(--warm-line); box-shadow: var(--warm-shadow-1); overflow: hidden; }
    .editor-toolbar { border-top: none !important; border-bottom: 1px solid var(--warm-line) !important; background: var(--warm-surface-2) !important; padding: 8px 12px; }
    .editor-toolbar button { color: var(--warm-ink-2) !important; border: none; border-radius: 6px; min-width: 30px; height: 30px; }
    .editor-toolbar button:hover { background: var(--warm-surface-3); color: var(--warm-ink) !important; }
    .editor-toolbar button.active { background: var(--warm-brand-100); color: var(--warm-brand-600) !important; }
    .editor-toolbar i.separator { border-left-color: var(--warm-line); }
    .CodeMirror { border: none !important; padding: 18px 22px; font-family: var(--warm-font-mono); font-size: 14px; line-height: 1.8; color: var(--warm-ink); min-height: 420px; background: var(--warm-surface) !important; }
    .CodeMirror-cursor { border-color: var(--warm-brand); }
    .CodeMirror-selected { background: var(--warm-brand-50) !important; }
    .CodeMirror-line::selection, .CodeMirror-line > span::selection, .CodeMirror-line > span > span::selection { background: var(--warm-brand-50); }
    .editor-preview, .editor-preview-side { padding: 18px 22px; font-family: var(--warm-font-title); font-size: 15px; line-height: 1.9; color: var(--warm-ink); background: var(--warm-surface) !important; }
    .editor-preview h1, .editor-preview-side h1 { font-size: 1.7rem; font-weight: 700; margin: 1em 0 0.5em; }
    .editor-preview h2, .editor-preview-side h2 { font-size: 1.4rem; font-weight: 700; margin: 1.2em 0 0.5em; }
    .editor-preview h3, .editor-preview-side h3 { font-size: 1.15rem; font-weight: 600; margin: 1em 0 0.4em; color: var(--warm-brand-600); }
    .editor-preview p, .editor-preview-side p { margin: 0.6em 0; }
    .editor-preview blockquote, .editor-preview-side blockquote { border-left: 3px solid var(--warm-brand-300); padding: 0.4em 0 0.4em 1em; margin: 1em 0; background: var(--warm-brand-50); border-radius: 0 8px 8px 0; color: var(--warm-ink-2); }
    .editor-preview code, .editor-preview-side code { font-family: var(--warm-font-mono); background: var(--warm-surface-3); padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
    .editor-preview pre, .editor-preview-side pre { background: #2b2622; color: #e8dfd4; padding: 14px 18px; border-radius: 10px; overflow-x: auto; margin: 1em 0; font-family: var(--warm-font-mono); font-size: 13px; line-height: 1.7; }
    .editor-preview pre code, .editor-preview-side pre code { background: none; padding: 0; color: inherit; }
    .editor-preview img, .editor-preview-side img { max-width: 100%; border-radius: 10px; margin: 1em 0; }
    .editor-preview hr, .editor-preview-side hr { border: none; border-top: 1px solid var(--warm-line); margin: 2em 0; }
    .editor-preview a, .editor-preview-side a { color: var(--warm-brand-600); text-decoration: underline; text-underline-offset: 2px; }
    .editor-preview table, .editor-preview-side table { width: 100%; border-collapse: collapse; margin: 1em 0; font-size: 14px; }
    .editor-preview th, .editor-preview td, .editor-preview-side th, .editor-preview-side td { padding: 8px 12px; border: 1px solid var(--warm-line); text-align: left; }
    .editor-preview th, .editor-preview-side th { background: var(--warm-surface-3); font-weight: 600; }
    .editor-statusbar { display: none; }
  </style>
</head>
<body class="min-h-screen" data-page="articles">
  <div id="sidebar-slot"></div>

  <main class="admin-main ml-[240px] min-h-screen p-8">
    <header class="mb-6 flex items-start justify-between flex-wrap gap-4">
      <div>
        <a href="posts.html" class="text-caption flex items-center gap-1 mb-2" style="color: var(--warm-ink-3);">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> 返回文章列表
        </a>
        <h1 class="text-h1" style="color: var(--warm-ink);" id="pageTitle">写新文章</h1>
      </div>
      <div class="flex items-center gap-3">
        <button id="saveDraftBtn" class="btn-secondary flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-medium">
          <i data-lucide="archive" class="w-4 h-4"></i><span>存草稿</span>
        </button>
        <button id="publishBtn" class="btn-primary flex items-center gap-2 px-5 py-2.5 rounded-lg text-sm font-medium">
          <i data-lucide="send" class="w-4 h-4"></i><span>发布</span>
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-[1fr_300px] gap-6 items-start">
      <!-- 编辑器 -->
      <div class="space-y-4">
        <input type="text" id="title" placeholder="写一个吸引人的标题……"
          class="input-field w-full font-title font-semibold text-xl px-4 py-3.5 rounded-warm-lg" style="background: var(--warm-surface);">

        <!-- AI 写作面板 -->
        <section class="card overflow-hidden" id="aiWriterCard">
          <button type="button" id="aiToggle" class="w-full flex items-center justify-between px-5 py-3.5 text-left" style="background: var(--warm-surface-2);">
            <span class="flex items-center gap-2 text-sm font-medium" style="color: var(--warm-ink);">
              <i data-lucide="sparkles" class="w-4 h-4" style="color: var(--warm-brand);"></i>
              AI 写作
              <span id="aiModelCount" class="text-caption" style="color: var(--warm-ink-3);"></span>
            </span>
            <i data-lucide="chevron-down" class="w-4 h-4 ai-chev" style="color: var(--warm-ink-2); transition: transform .2s;"></i>
          </button>
          <div id="aiPanel" class="hidden p-5 space-y-4">
            <!-- 模型选择 + 快捷动作 -->
            <div class="flex flex-wrap items-center gap-3">
              <div class="flex items-center gap-2 flex-1 min-w-[220px]">
                <label class="text-caption whitespace-nowrap" style="color: var(--warm-ink-2);">模型</label>
                <select id="aiModelSel" class="input-field flex-1 px-3 py-2 rounded-warm-md text-sm">
                  <option value="">加载中…</option>
                </select>
              </div>
              <a href="ai.html" class="text-caption flex items-center gap-1" style="color: var(--warm-ink-3);" title="去 AI 配置页">
                <i data-lucide="settings" class="w-3.5 h-3.5"></i>配置
              </a>
            </div>

            <!-- 提示词 -->
            <div class="flex flex-col gap-2">
              <label class="text-caption" style="color: var(--warm-ink-2);">提示词</label>
              <textarea id="aiPrompt" rows="3" class="input-field px-3 py-2.5 rounded-warm-md text-sm resize-none" placeholder="描述你想让 AI 写什么，例如：以《标题》为主题写一篇 800 字的散文，风格温柔治愈"></textarea>
            </div>

            <!-- 快捷模板 -->
            <div class="flex flex-wrap gap-2">
              <button type="button" class="btn-secondary px-3 py-1.5 rounded-lg text-xs font-medium ai-tpl" data-tpl="continue"><i data-lucide="corner-down-right" class="w-3.5 h-3.5"></i>续写正文</button>
              <button type="button" class="btn-secondary px-3 py-1.5 rounded-lg text-xs font-medium ai-tpl" data-tpl="polish"><i data-lucide="wand-2" class="w-3.5 h-3.5"></i>润色正文</button>
              <button type="button" class="btn-secondary px-3 py-1.5 rounded-lg text-xs font-medium ai-tpl" data-tpl="outline"><i data-lucide="list" class="w-3.5 h-3.5"></i>生成大纲</button>
              <button type="button" class="btn-secondary px-3 py-1.5 rounded-lg text-xs font-medium ai-tpl" data-tpl="excerpt"><i data-lucide="align-left" class="w-3.5 h-3.5"></i>生成摘要</button>
              <button type="button" class="btn-secondary px-3 py-1.5 rounded-lg text-xs font-medium ai-tpl" data-tpl="title"><i data-lucide="type" class="w-3.5 h-3.5"></i>生成标题</button>
            </div>

            <!-- 生成按钮 -->
            <div class="flex items-center gap-3">
              <button type="button" id="aiGenBtn" class="btn-primary flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium">
                <i data-lucide="sparkles" class="w-4 h-4"></i><span>生成</span>
              </button>
              <label class="flex items-center gap-2 text-caption" style="color: var(--warm-ink-2);">
                <input type="number" id="aiMaxTokens" value="2048" min="64" max="8192" class="input-field px-2 py-1 rounded text-xs w-20">最大 token
              </label>
              <span id="aiStatus" class="text-caption" style="color: var(--warm-ink-3);"></span>
            </div>

            <!-- 结果区 -->
            <div id="aiResultWrap" class="hidden flex flex-col gap-2">
              <label class="text-caption" style="color: var(--warm-ink-2);">生成结果</label>
              <textarea id="aiResult" rows="8" class="input-field px-3 py-2.5 rounded-warm-md text-sm resize-y font-mono" style="min-height: 160px;"></textarea>
              <div class="flex flex-wrap gap-2">
                <button type="button" id="aiInsertBtn" class="btn-secondary flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium"><i data-lucide="corner-down-left" class="w-3.5 h-3.5"></i>插入到正文</button>
                <button type="button" id="aiAppendBtn" class="btn-secondary flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium"><i data-lucide="plus" class="w-3.5 h-3.5"></i>追加到正文</button>
                <button type="button" id="aiReplaceBtn" class="btn-secondary flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium"><i data-lucide="replace" class="w-3.5 h-3.5"></i>替换正文</button>
                <button type="button" id="aiToExcerptBtn" class="btn-secondary flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium"><i data-lucide="align-left" class="w-3.5 h-3.5"></i>填入摘要</button>
                <button type="button" id="aiToTitleBtn" class="btn-secondary flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium"><i data-lucide="type" class="w-3.5 h-3.5"></i>填入标题</button>
                <button type="button" id="aiCopyBtn" class="btn-secondary flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium"><i data-lucide="copy" class="w-3.5 h-3.5"></i>复制</button>
              </div>
            </div>
          </div>
        </section>

        <textarea id="content" placeholder="在这里书写 Markdown..."></textarea>
      </div>

      <!-- 侧栏 -->
      <aside class="space-y-4">
        <section class="card p-5">
          <div class="flex items-center gap-2 mb-4">
            <i data-lucide="settings-2" class="w-4 h-4" style="color: var(--warm-brand);"></i>
            <h2 class="text-h3" style="color: var(--warm-ink);">发布设置</h2>
          </div>
          <div class="space-y-4">
            <div>
              <label class="block text-caption mb-1.5" style="color: var(--warm-ink-2);">状态</label>
              <select id="status" class="input-field w-full px-3 py-2 rounded-warm-md text-sm">
                <option value="draft">草稿</option><option value="pub">已发布</option>
              </select>
            </div>
            <div>
              <label class="block text-caption mb-1.5" style="color: var(--warm-ink-2);">日期</label>
              <input type="date" id="date" class="input-field w-full px-3 py-2 rounded-warm-md text-sm">
            </div>
            <div>
              <label class="block text-caption mb-1.5" style="color: var(--warm-ink-2);">封面图 URL</label>
              <input type="text" id="cover" class="input-field w-full px-3 py-2 rounded-warm-md text-sm" placeholder="images/xxx.jpg">
              <div id="coverPreview" class="mt-2 rounded-warm-md overflow-hidden hidden" style="border: 1px solid var(--warm-line); max-height: 120px;">
                <img id="coverPreviewImg" alt="封面预览" class="w-full h-full object-cover block">
              </div>
            </div>
            <div>
              <label class="block text-caption mb-1.5" style="color: var(--warm-ink-2);">摘要</label>
              <textarea id="excerpt" rows="3" class="input-field w-full px-3 py-2 rounded-warm-md text-sm resize-none" placeholder="简短摘要……"></textarea>
            </div>
          </div>
        </section>

        <section class="card p-5">
          <div class="flex items-center gap-2 mb-4">
            <i data-lucide="folder-open" class="w-4 h-4" style="color: var(--warm-brand);"></i>
            <h2 class="text-h3" style="color: var(--warm-ink);">分类与标签</h2>
          </div>
          <div class="space-y-4">
            <div>
              <label class="block text-caption mb-1.5" style="color: var(--warm-ink-2);">分类</label>
              <select id="categoryId" class="input-field w-full px-3 py-2 rounded-warm-md text-sm"></select>
            </div>
            <div>
              <label class="block text-caption mb-1.5" style="color: var(--warm-ink-2);">标签（逗号分隔）</label>
              <input type="text" id="tag" class="input-field w-full px-3 py-2 rounded-warm-md text-sm" placeholder="例如：旅行, 云海, 秋天">
            </div>
          </div>
        </section>

        <!-- AI 配图 -->
        <section class="card p-5">
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
              <i data-lucide="image" class="w-4 h-4" style="color: var(--warm-brand);"></i>
              <h2 class="text-h3" style="color: var(--warm-ink);">AI 配图</h2>
            </div>
            <a href="ai.html" class="text-caption" style="color: var(--warm-ink-3);" title="去 AI 配置页">配置</a>
          </div>
          <div class="space-y-3">
            <div>
              <label class="block text-caption mb-1.5" style="color: var(--warm-ink-2);">文生图模型</label>
              <select id="imgModelSel" class="input-field w-full px-3 py-2 rounded-warm-md text-sm">
                <option value="">加载中…</option>
              </select>
            </div>
            <div>
              <label class="block text-caption mb-1.5" style="color: var(--warm-ink-2);">提示词</label>
              <textarea id="imgPrompt" rows="3" class="input-field w-full px-3 py-2 rounded-warm-md text-sm resize-none" placeholder="描述想要的图片，例如：星空下的云海，温暖色调，电影感"></textarea>
            </div>
            <div class="flex items-center gap-2">
              <label class="text-caption whitespace-nowrap" style="color: var(--warm-ink-2);">尺寸</label>
              <input type="text" id="imgSize" class="input-field flex-1 px-2 py-1.5 rounded text-xs" placeholder="留空用默认；火山可填 2K，DALL·E 填 1024x1024">
            </div>
            <button type="button" id="imgGenBtn" class="btn-primary w-full flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm font-medium">
              <i data-lucide="sparkles" class="w-4 h-4"></i><span>生成图片</span>
            </button>
            <p id="imgStatus" class="text-caption" style="color: var(--warm-ink-3);"></p>
            <div id="imgResultWrap" class="hidden space-y-2">
              <div class="rounded-warm-md overflow-hidden" style="border: 1px solid var(--warm-line); max-height: 200px;">
                <img id="imgPreview" alt="AI 生成" class="w-full h-full object-cover block" style="max-height: 200px;">
              </div>
              <input type="text" id="imgUrl" class="input-field w-full px-2 py-1.5 rounded text-xs font-mono" readonly>
              <div class="flex flex-wrap gap-2">
                <button type="button" id="imgToCoverBtn" class="btn-secondary flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium"><i data-lucide="image" class="w-3.5 h-3.5"></i>填入封面</button>
                <button type="button" id="imgInsertBtn" class="btn-secondary flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium"><i data-lucide="corner-down-left" class="w-3.5 h-3.5"></i>插入正文</button>
                <button type="button" id="imgCopyBtn" class="btn-secondary flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium"><i data-lucide="copy" class="w-3.5 h-3.5"></i>复制</button>
              </div>
            </div>
          </div>
        </section>

        <!-- 图片上传（OSS） -->
        <section class="card p-5">
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
              <i data-lucide="cloud-upload" class="w-4 h-4" style="color: var(--warm-brand);"></i>
              <h2 class="text-h3" style="color: var(--warm-ink);">图片上传</h2>
            </div>
            <a href="oss.html" class="text-caption" style="color: var(--warm-ink-3);" title="去 OSS 配置页">配置</a>
          </div>
          <div class="space-y-3">
            <div id="upDrop" class="rounded-lg border-2 border-dashed text-center py-6 px-4 cursor-pointer transition" style="border-color: var(--warm-line); color: var(--warm-ink-3);">
              <i data-lucide="upload" class="w-6 h-6 mx-auto mb-2"></i>
              <div class="text-sm" style="color: var(--warm-ink-2);">点击或拖拽图片到此处上传</div>
              <div class="text-caption mt-1">单文件 ≤ 20MB，上传至 OSS</div>
              <input type="file" id="upFile" accept="image/*" class="hidden">
            </div>
            <p id="upStatus" class="text-caption" style="color: var(--warm-ink-3);"></p>
            <div id="upResultWrap" class="hidden space-y-2">
              <div class="rounded-warm-md overflow-hidden" style="border: 1px solid var(--warm-line); max-height: 200px;">
                <img id="upPreview" alt="上传图片" class="w-full h-full object-cover block" style="max-height: 200px;">
              </div>
              <input type="text" id="upUrl" class="input-field w-full px-2 py-1.5 rounded text-xs font-mono" readonly>
              <div class="flex flex-wrap gap-2">
                <button type="button" id="upToCoverBtn" class="btn-secondary flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium"><i data-lucide="image" class="w-3.5 h-3.5"></i>填入封面</button>
                <button type="button" id="upInsertBtn" class="btn-secondary flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium"><i data-lucide="corner-down-left" class="w-3.5 h-3.5"></i>插入正文</button>
                <button type="button" id="upCopyBtn" class="btn-secondary flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium"><i data-lucide="copy" class="w-3.5 h-3.5"></i>复制</button>
              </div>
            </div>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <script src="../js/codemirror.min.js"></script>
  <script src="../js/codemirror-xml.min.js"></script>
  <script src="../js/codemirror-overlay.min.js"></script>
  <script src="../js/codemirror-gfm.min.js"></script>
  <script src="../js/codemirror-markdown.min.js"></script>
  <script src="../js/easymde.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    if (!API.isAuthed()) window.location.href = '../login.html';

    const params = new URLSearchParams(location.search);
    const editId = params.get('id') ? +params.get('id') : null;

    const easyMDE = new EasyMDE({
      element: document.getElementById('content'),
      spellChecker: false,
      autosave: { enabled: false },
      renderingConfig: { singleLineBreaks: false },
      placeholder: '在这里书写 Markdown...\n\n支持 # 标题、> 引用、- 列表、```代码块、表格等',
      toolbar: ['bold', 'italic', 'heading', '|', 'link', 'image', 'quote', 'code', '|', 'unordered-list', 'ordered-list', 'table', 'horizontal-rule', '|', 'preview', 'side-by-side', 'fullscreen'],
      status: false,
      minHeight: '420px',
    });

    // 加载分类
    (async function loadCats() {
      const cats = await API.getCategories();
      const sel = document.getElementById('categoryId');
      sel.innerHTML = '<option value="">未分类</option>' + cats.filter(c => c.name !== '全部').map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    })();

    // 加载文章
    (async function () {
      if (editId) {
        try {
          const post = await API.getPost(editId);
          document.getElementById('pageTitle').textContent = '编辑文章';
          document.getElementById('title').value = post.title || '';
          easyMDE.value(post.content || '');
          document.getElementById('date').value = post.date || '';
          document.getElementById('cover').value = post.cover || '';
          document.getElementById('tag').value = post.tag || '';
          document.getElementById('excerpt').value = post.excerpt || '';
          document.getElementById('status').value = post.status || 'draft';
          if (post.categoryId) document.getElementById('categoryId').value = post.categoryId;
          if (post.cover) showCoverPreview(post.cover);
        } catch (e) { Admin.toast('加载文章失败: ' + e.message); }
      } else {
        document.getElementById('date').value = new Date().toISOString().substring(0, 10);
      }
    })();

    const imgUrl = Admin.imgUrl;
    function showCoverPreview(url) {
      const preview = document.getElementById('coverPreview');
      const img = document.getElementById('coverPreviewImg');
      img.src = imgUrl(url);
      preview.classList.remove('hidden');
    }
    document.getElementById('cover').addEventListener('input', function () {
      const url = this.value.trim();
      if (url) showCoverPreview(url);
      else document.getElementById('coverPreview').classList.add('hidden');
    });

    /* ============ AI 写作 ============ */
    const aiPanel = document.getElementById('aiPanel');
    const aiChev = document.querySelector('.ai-chev');
    const aiModelSel = document.getElementById('aiModelSel');
    const aiPrompt = document.getElementById('aiPrompt');
    const aiResult = document.getElementById('aiResult');
    const aiResultWrap = document.getElementById('aiResultWrap');
    const aiStatus = document.getElementById('aiStatus');
    const aiGenBtn = document.getElementById('aiGenBtn');
    let aiModels = [];

    document.getElementById('aiToggle').addEventListener('click', () => {
      const hidden = aiPanel.classList.toggle('hidden');
      aiChev.style.transform = hidden ? '' : 'rotate(180deg)';
    });

    (async function loadAiModels() {
      try {
        aiModels = await API.getTextModels();
        const cnt = document.getElementById('aiModelCount');
        if (!aiModels.length) {
          aiModelSel.innerHTML = '<option value="">未配置文本模型，请先到 AI 配置页添加</option>';
          cnt.textContent = '· 0 个模型';
          return;
        }
        cnt.textContent = `· ${aiModels.length} 个模型`;
        aiModelSel.innerHTML = aiModels.map(m => `<option value="${m.id}">${Admin.esc(m.displayName || m.modelId)} (${Admin.esc(m.provider)})</option>`).join('');
      } catch (e) {
        aiModelSel.innerHTML = '<option value="">加载失败</option>';
        aiStatus.textContent = '加载模型失败: ' + e.message;
      }
    })();

    /* 快捷模板：根据当前标题/正文填充提示词 */
    const TPL = {
      continue: () => {
        const t = document.getElementById('title').value.trim();
        const c = easyMDE.value().trim();
        return `请根据以下已有内容继续续写一篇 Markdown 格式的文章。标题：${t || '（未定）'}\n已有正文：\n${c || '（空）'}\n\n请自然衔接，续写 400-600 字，保持风格一致。`;
      },
      polish: () => {
        const c = easyMDE.value().trim();
        return `请润色以下 Markdown 文章，优化语言流畅度与表达，保留原意与 Markdown 格式，不要加多余说明，直接输出润色后的正文：\n\n${c || '（正文为空）'}`;
      },
      outline: () => {
        const t = document.getElementById('title').value.trim();
        return `请为文章《${t || '（未定标题）'}》生成一份 Markdown 大纲，包含 3-5 个一级小节，每节简述要点。`;
      },
      excerpt: () => {
        const c = easyMDE.value().trim();
        return `请为以下文章写一句 50-100 字的简短摘要，只输出摘要正文，不要加“摘要：”等前缀：\n\n${c || '（正文为空）'}`;
      },
      title: () => {
        const c = easyMDE.value().trim();
        return `请根据以下文章内容生成 5 个吸引人的标题候选，每行一个，不加序号：\n\n${c || '（正文为空）'}`;
      },
    };
    document.querySelectorAll('.ai-tpl').forEach(btn => btn.addEventListener('click', () => {
      const fn = TPL[btn.dataset.tpl];
      if (fn) { aiPrompt.value = fn(); aiPrompt.focus(); }
    }));

    async function aiGenerate() {
      const id = +aiModelSel.value;
      if (!id) return Admin.toast('请先选择模型');
      const prompt = aiPrompt.value.trim();
      if (!prompt) return Admin.toast('请输入提示词');
      if (!aiModels.length) return Admin.toast('没有可用的文本模型');
      const old = aiGenBtn.innerHTML;
      aiGenBtn.disabled = true;
      aiGenBtn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i><span>生成中…</span>';
      if (window.lucide) window.lucide.createIcons();
      aiStatus.textContent = '调用模型中，请稍候…';
      aiResultWrap.classList.add('hidden');
      try {
        const max = parseInt(document.getElementById('aiMaxTokens').value, 10) || 2048;
        const r = await API.aiGenerate({ id, prompt, maxTokens: max });
        if (r.ok) {
          aiResult.value = r.content || '';
          aiResultWrap.classList.remove('hidden');
          aiStatus.textContent = '生成完成';
        } else {
          aiStatus.textContent = '生成失败';
          Admin.toast(r.error || '生成失败');
        }
      } catch (e) {
        aiStatus.textContent = '生成失败: ' + e.message;
        Admin.toast('生成失败: ' + e.message);
      } finally {
        aiGenBtn.disabled = false; aiGenBtn.innerHTML = old; if (window.lucide) window.lucide.createIcons();
      }
    }
    aiGenBtn.addEventListener('click', aiGenerate);
    aiPrompt.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); aiGenerate(); } });

    function insertToContent(text) {
      if (!text) return;
      const cm = easyMDE.codemirror;
      const cur = cm.getCursor();
      cm.replaceRange(text, cur);
      cm.focus();
      cm.setCursor({ line: cur.line + text.split('\n').length - 1, ch: 0 });
    }
    document.getElementById('aiInsertBtn').addEventListener('click', () => insertToContent(aiResult.value));
    document.getElementById('aiAppendBtn').addEventListener('click', () => {
      const cur = easyMDE.value();
      easyMDE.value((cur ? cur.replace(/\n*$/, '') + '\n\n' : '') + aiResult.value);
      easyMDE.codemirror.focus();
    });
    document.getElementById('aiReplaceBtn').addEventListener('click', () => {
      if (easyMDE.value().trim() && !confirm('确定用生成结果替换现有正文？')) return;
      easyMDE.value(aiResult.value);
      easyMDE.codemirror.focus();
    });
    document.getElementById('aiToExcerptBtn').addEventListener('click', () => { document.getElementById('excerpt').value = aiResult.value.trim(); Admin.toast('已填入摘要'); });
    document.getElementById('aiToTitleBtn').addEventListener('click', () => {
      // 取结果首行作为标题候选
      const first = aiResult.value.split('\n').map(s => s.trim()).filter(Boolean)[0] || aiResult.value.trim();
      document.getElementById('title').value = first;
      Admin.toast('已填入标题');
    });
    document.getElementById('aiCopyBtn').addEventListener('click', () => {
      aiResult.select(); document.execCommand('copy'); Admin.toast('已复制');
    });

    /* ============ AI 配图 ============ */
    const imgModelSel = document.getElementById('imgModelSel');
    const imgPrompt = document.getElementById('imgPrompt');
    const imgGenBtn = document.getElementById('imgGenBtn');
    const imgStatus = document.getElementById('imgStatus');
    const imgResultWrap = document.getElementById('imgResultWrap');
    const imgPreview = document.getElementById('imgPreview');
    const imgUrlInput = document.getElementById('imgUrl');
    let imgModels = [];

    (async function loadImgModels() {
      try {
        imgModels = await API.getImageModels();
        if (!imgModels.length) {
          imgModelSel.innerHTML = '<option value="">未配置文生图模型</option>';
          return;
        }
        imgModelSel.innerHTML = imgModels.map(m => `<option value="${m.id}">${Admin.esc(m.displayName || m.modelId)} (${Admin.esc(m.provider)})</option>`).join('');
      } catch (e) {
        imgModelSel.innerHTML = '<option value="">加载失败</option>';
        imgStatus.textContent = '加载模型失败: ' + e.message;
      }
    })();

    async function imgGenerate() {
      const id = +imgModelSel.value;
      if (!id) return Admin.toast('请先选择文生图模型');
      const prompt = imgPrompt.value.trim();
      if (!prompt) return Admin.toast('请输入提示词');
      const old = imgGenBtn.innerHTML;
      imgGenBtn.disabled = true;
      imgGenBtn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i><span>生成中…</span>';
      if (window.lucide) window.lucide.createIcons();
      imgStatus.textContent = '调用文生图模型中，可能需要十几秒…';
      imgResultWrap.classList.add('hidden');
      try {
        const size = document.getElementById('imgSize').value.trim();
        const r = await API.aiGenerateImage({ id, prompt, size: size || undefined });
        if (r.ok && r.url) {
          imgPreview.src = r.url;
          imgUrlInput.value = r.url;
          imgResultWrap.classList.remove('hidden');
          imgStatus.textContent = '生成完成';
        } else {
          imgStatus.textContent = '生成失败';
          Admin.toast(r.error || '生成失败');
        }
      } catch (e) {
        imgStatus.textContent = '生成失败: ' + e.message;
        Admin.toast('生成失败: ' + e.message);
      } finally {
        imgGenBtn.disabled = false; imgGenBtn.innerHTML = old; if (window.lucide) window.lucide.createIcons();
      }
    }
    imgGenBtn.addEventListener('click', imgGenerate);

    document.getElementById('imgToCoverBtn').addEventListener('click', () => {
      const u = imgUrlInput.value.trim();
      if (!u) return Admin.toast('没有可用的图片地址');
      document.getElementById('cover').value = u;
      showCoverPreview(u);
      Admin.toast('已填入封面');
    });
    document.getElementById('imgInsertBtn').addEventListener('click', () => {
      const u = imgUrlInput.value.trim();
      if (!u) return Admin.toast('没有可用的图片地址');
      insertToContent(`\n![AI生成图片](${u})\n`);
      Admin.toast('已插入正文');
    });
    document.getElementById('imgCopyBtn').addEventListener('click', () => {
      imgUrlInput.select(); document.execCommand('copy'); Admin.toast('已复制图片地址');
    });

    /* ============ 图片上传（OSS） ============ */
    const upDrop = document.getElementById('upDrop');
    const upFile = document.getElementById('upFile');
    const upStatus = document.getElementById('upStatus');
    const upResultWrap = document.getElementById('upResultWrap');
    const upPreview = document.getElementById('upPreview');
    const upUrl = document.getElementById('upUrl');
    let upBusy = false;

    function upShowResult(url, name) {
      upPreview.src = url;
      upUrl.value = url;
      upResultWrap.classList.remove('hidden');
      upStatus.textContent = `已上传：${name}`;
    }
    async function doUpload(file) {
      if (upBusy) return;
      if (!file) return;
      if (!/^image\//.test(file.type)) { Admin.toast('请选择图片文件'); return; }
      if (file.size > 20 * 1024 * 1024) { Admin.toast('文件超过 20MB'); return; }
      upBusy = true;
      upStatus.textContent = '上传中…';
      upDrop.style.opacity = '.6';
      try {
        const r = await API.uploadOss(file);
        upShowResult(r.url, r.name || file.name);
        Admin.toast('上传成功');
      } catch (e) {
        upStatus.textContent = '';
        Admin.toast('上传失败: ' + e.message);
      } finally {
        upBusy = false; upDrop.style.opacity = '1'; upFile.value = '';
      }
    }
    upDrop.addEventListener('click', () => upFile.click());
    upFile.addEventListener('change', () => doUpload(upFile.files[0]));
    ['dragenter', 'dragover'].forEach(ev => upDrop.addEventListener(ev, e => { e.preventDefault(); upDrop.style.borderColor = 'var(--warm-brand)'; }));
    ['dragleave', 'drop'].forEach(ev => upDrop.addEventListener(ev, e => { e.preventDefault(); upDrop.style.borderColor = 'var(--warm-line)'; }));
    upDrop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) doUpload(f); });
    document.getElementById('upToCoverBtn').addEventListener('click', () => {
      const u = upUrl.value.trim(); if (!u) return Admin.toast('没有可填入的图片');
      document.getElementById('cover').value = u;
      showCoverPreview(u); Admin.toast('已填入封面');
    });
    document.getElementById('upInsertBtn').addEventListener('click', () => {
      const u = upUrl.value.trim(); if (!u) return Admin.toast('没有可插入的图片');
      const alt = (upStatus.textContent.match(/已上传：(.*?)$/) || [])[1] || '图片';
      insertToContent(`![${alt}](${u})\n`);
      Admin.toast('已插入正文');
    });
    document.getElementById('upCopyBtn').addEventListener('click', () => {
      upUrl.select(); document.execCommand('copy'); Admin.toast('已复制图片地址');
    });


    async function save(status) {
      const data = {
        title: document.getElementById('title').value.trim(),
        content: easyMDE.value().trim(),
        date: document.getElementById('date').value || new Date().toISOString().substring(0, 10),
        cover: document.getElementById('cover').value.trim(),
        tag: document.getElementById('tag').value.trim(),
        excerpt: document.getElementById('excerpt').value.trim(),
        categoryId: document.getElementById('categoryId').value ? +document.getElementById('categoryId').value : null,
        status: status
      };
      if (!data.title) return Admin.toast('标题不能为空');
      if (!data.content) return Admin.toast('正文不能为空');
      data.slug = data.title.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').toLowerCase();
      try {
        if (editId) await API.updatePost(editId, data);
        else await API.createPost(data);
        Admin.toast(status === 'pub' ? '已发布' : '已保存草稿');
        setTimeout(() => { window.location.href = 'posts.html'; }, 600);
      } catch (e) { Admin.toast('保存失败: ' + e.message); }
    }

    document.getElementById('publishBtn').addEventListener('click', () => save('pub'));
    document.getElementById('saveDraftBtn').addEventListener('click', () => save('draft'));
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(document.getElementById('status').value); }
    });
  </script>
</body>
</html>
