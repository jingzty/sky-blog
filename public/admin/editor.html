<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑文章 — 远远的天空</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Fira+Code:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    @font-face { font-family: 'Fira Code'; src: local('Fira Code'), local('FiraCode-Regular'); font-weight: 400; font-style: normal; font-display: swap; }
  </style>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../js/codemirror.min.css">
  <link rel="stylesheet" href="../js/easymde.min.css">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--sans);background:#f5f2ed;color:var(--day-ink);min-height:100vh}
    a{color:inherit;text-decoration:none}
    button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
    input,textarea,select{font-family:inherit;outline:none}
    ::selection{background:var(--gold);color:#fff}

    .topbar{position:sticky;top:0;z-index:100;background:rgba(245,242,237,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,0.06)}
    .topbar-inner{max-width:var(--max);margin:0 auto;padding:12px 40px;display:flex;align-items:center;gap:12px}
    .topbar-back{display:inline-flex;align-items:center;gap:5px;font-size:0.82rem;color:var(--taupe);padding:6px 14px 6px 10px;border-radius:100px;transition:all 0.3s}
    .topbar-back:hover{color:var(--day-ink);background:rgba(0,0,0,0.04)}
    .topbar-back svg{width:14px;height:14px}
    .topbar-title{font-family:var(--serif);font-weight:600;font-size:1rem;color:var(--day-ink)}
    .topbar-spacer{flex:1}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:100px;font-size:0.82rem;font-weight:500;transition:all 0.25s var(--ease)}
    .btn-ghost{color:var(--taupe);background:transparent}
    .btn-ghost:hover{color:var(--day-ink);background:rgba(0,0,0,0.04)}
    .btn-gold{background:var(--gold);color:#1a1206}
    .btn-gold:hover{background:var(--gold-soft)}
    .btn svg{width:15px;height:15px}

    .editor-layout{max-width:var(--max);margin:0 auto;padding:28px 40px 80px;display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
    .editor-main{display:flex;flex-direction:column;gap:14px}
    .title-input{width:100%;font-family:var(--serif);font-weight:700;font-size:1.5rem;padding:14px 18px;border:none;border-radius:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.04);transition:box-shadow 0.3s}
    .title-input:focus{box-shadow:0 2px 12px rgba(0,0,0,0.06)}

    .editor-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.04)}

    /* EasyMDE 自定义主题 */
    .editor-toolbar{border-top:1px solid rgba(0,0,0,0.04);border-bottom:1px solid rgba(0,0,0,0.06);padding:6px 10px;background:#fff}
    .editor-toolbar button{color:var(--taupe) !important;border:none;border-radius:6px;padding:4px 6px;min-width:28px;height:28px}
    .editor-toolbar button:hover{background:rgba(0,0,0,0.05);color:var(--day-ink) !important}
    .editor-toolbar button.active{background:rgba(0,0,0,0.06)}
    .editor-toolbar i.separator{border-color:rgba(0,0,0,0.08)}
    .CodeMirror{border:none;padding:16px 20px;font-family:'Fira Code','JetBrains Mono','SF Mono',Monaco,'Cascadia Code','Roboto Mono',Consolas,'Courier New',monospace;font-size:0.88rem;line-height:1.8;color:var(--day-ink);min-height:400px}
    .CodeMirror-cursor{border-color:var(--day-ink)}
    .CodeMirror-selected{background:rgba(201,118,74,0.1) !important}
    .editor-preview,.editor-preview-side{padding:16px 20px;font-family:var(--serif);font-size:0.95rem;line-height:2;color:var(--day-ink)}
    .editor-preview h1,.editor-preview-side h1{font-size:1.7rem;font-weight:700;margin:1em 0 0.5em}
    .editor-preview h2,.editor-preview-side h2{font-size:1.4rem;font-weight:700;margin:1.2em 0 0.5em}
    .editor-preview h3,.editor-preview-side h3{font-size:1.15rem;font-weight:600;margin:1em 0 0.4em;color:var(--dawn-deep)}
    .editor-preview p,.editor-preview-side p{margin:0.6em 0}
    .editor-preview blockquote,.editor-preview-side blockquote{border-left:3px solid var(--gold-soft);padding:0.4em 0 0.4em 1em;margin:1em 0;background:rgba(212,179,129,0.08);border-radius:0 8px 8px 0;color:var(--taupe)}
    .editor-preview code,.editor-preview-side code{font-family:'Fira Code','JetBrains Mono',Monaco,Consolas,monospace;background:rgba(74,42,24,0.08);padding:2px 6px;border-radius:4px;font-size:0.85em}
    .editor-preview pre,.editor-preview-side pre{background:#1e1e2e;color:#cdd6f4;padding:14px 18px;border-radius:10px;overflow-x:auto;margin:1em 0;font-family:'Fira Code','JetBrains Mono',Monaco,Consolas,monospace;font-size:0.86rem;line-height:1.7}
    .editor-preview pre code,.editor-preview-side pre code{background:none;padding:0;color:inherit}
    .editor-preview img,.editor-preview-side img{max-width:100%;border-radius:10px;margin:1em 0}
    .editor-preview hr,.editor-preview-side hr{border:none;border-top:1px solid rgba(74,42,24,0.12);margin:2em 0}
    .editor-preview a,.editor-preview-side a{color:var(--dawn-deep);text-decoration:underline;text-underline-offset:2px}
    .editor-preview table,.editor-preview-side table{width:100%;border-collapse:collapse;margin:1em 0;font-size:0.9rem}
    .editor-preview th,.editor-preview td,.editor-preview-side th,.editor-preview-side td{padding:8px 12px;border:1px solid rgba(74,42,24,0.1);text-align:left}
    .editor-preview th,.editor-preview-side th{background:rgba(201,118,74,0.08);font-weight:600}
    .editor-statusbar{display:none}

    .editor-footer{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:#faf8f5;border-top:1px solid rgba(0,0,0,0.05);font-size:0.72rem;color:var(--taupe)}
    .editor-footer .stats{display:flex;gap:14px}

    .editor-side{display:flex;flex-direction:column;gap:14px}
    .side-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
    .side-card-head{display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;user-select:none;transition:background 0.2s}
    .side-card-head:hover{background:rgba(0,0,0,0.02)}
    .side-card-head .arrow{font-size:0.6rem;color:var(--taupe);transition:transform 0.25s}
    .side-card-head.collapsed .arrow{transform:rotate(-90deg)}
    .side-card-head h4{font-size:0.75rem;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--taupe)}
    .side-card-body{padding:0 16px 16px}
    .side-card-body.hide{display:none}
    .side-card-body label{display:block;font-size:0.72rem;color:var(--taupe);margin-bottom:4px;margin-top:10px}
    .side-card-body label:first-child{margin-top:0}
    .side-card-body input,.side-card-body select,.side-card-body textarea{width:100%;padding:9px 12px;border:1px solid rgba(0,0,0,0.08);border-radius:8px;font-size:0.82rem;transition:border-color 0.25s;background:#faf8f5}
    .side-card-body input:focus,.side-card-body select:focus,.side-card-body textarea:focus{border-color:var(--dawn-deep);background:#fff}
    .cover-preview{margin-top:8px;border-radius:8px;overflow:hidden;border:1px solid rgba(0,0,0,0.06);max-height:120px}
    .cover-preview img{width:100%;height:100%;object-fit:cover;display:block}

    @media(max-width:860px){
      .topbar-inner{padding:12px 16px}
      .editor-layout{grid-template-columns:1fr;padding:20px 16px 60px}
      .title-input{font-size:1.2rem;padding:12px 14px}
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="posts.html" class="topbar-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>返回</a>
      <span class="topbar-title" id="pageTitle">写新文章</span>
      <span class="topbar-spacer"></span>
      <button class="btn btn-ghost" id="saveDraftBtn">存草稿</button>
      <button class="btn btn-gold" id="publishBtn">发布</button>
    </div>
  </header>

  <div class="editor-layout">
    <div class="editor-main">
      <input type="text" class="title-input" id="title" placeholder="写一个吸引人的标题……">
      <div class="editor-card">
        <textarea id="content" placeholder="在这里书写 Markdown..."></textarea>
        <div class="editor-footer">
          <div class="stats">
            <span id="wordCount">0</span> 字 · <span id="lineCount">0</span> 行
          </div>
          <span id="charCount">0 字节</span>
        </div>
      </div>
    </div>

    <div class="editor-side">
      <div class="side-card">
        <div class="side-card-head" data-toggle>
          <span class="arrow">▼</span>
          <h4>发布设置</h4>
        </div>
        <div class="side-card-body">
          <label>状态</label>
          <select id="status">
            <option value="draft">草稿</option>
            <option value="pub">已发布</option>
          </select>
          <label>日期</label>
          <input type="date" id="date">
          <label>封面图 URL</label>
          <input type="text" id="cover" placeholder="images/xxx.jpg">
          <div class="cover-preview" id="coverPreview" style="display:none"><img id="coverPreviewImg" alt="封面预览"></div>
          <label>摘要</label>
          <textarea id="excerpt" rows="3" placeholder="简短摘要……" style="resize:vertical;min-height:60px"></textarea>
        </div>
      </div>
      <div class="side-card">
        <div class="side-card-head" data-toggle>
          <span class="arrow">▼</span>
          <h4>分类与标签</h4>
        </div>
        <div class="side-card-body">
          <label>分类</label>
          <select id="categoryId"></select>
          <label>标签（逗号分隔）</label>
          <input type="text" id="tag" placeholder="例如：旅行, 云海, 秋天">
        </div>
      </div>
    </div>
  </div>

  <script src="../js/codemirror.min.js"></script>
  <script src="../js/codemirror-xml.min.js"></script>
  <script src="../js/codemirror-overlay.min.js"></script>
  <script src="../js/codemirror-gfm.min.js"></script>
  <script src="../js/codemirror-markdown.min.js"></script>
  <script src="../js/marked.umd.js"></script>
  <script src="../js/easymde.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    if(!API.isAuthed()){ window.location.href = '../login.html'; }

    const params = new URLSearchParams(location.search);
    const editId = params.get('id') ? +params.get('id') : null;

    // ===== EasyMDE 初始化 =====
    const easyMDE = new EasyMDE({
      element: document.getElementById('content'),
      spellChecker: false,
      autosave: { enabled: false },
      renderingConfig: { singleLineBreaks: false },
      placeholder: '在这里书写 Markdown...\n\n支持 # 标题、> 引用、- 列表、```代码块、表格等',
      toolbar: ['bold','italic','heading','|','link','image','quote','code','|','unordered-list','ordered-list','table','horizontal-rule','|','preview','side-by-side','fullscreen'],
      status: false,
      minHeight: '400px',
    });

    function updateStats(){
      const text = easyMDE.value();
      document.getElementById('wordCount').textContent = text.length;
      document.getElementById('lineCount').textContent = text.split('\n').length;
      document.getElementById('charCount').textContent = new TextEncoder().encode(text).length + ' 字节';
    }
    easyMDE.codemirror.on('change', updateStats);

    // ===== 加载分类 =====
    (async function loadCats(){
      const cats = await API.getCategories();
      const sel = document.getElementById('categoryId');
      sel.innerHTML = '<option value="">未分类</option>' + cats.filter(c=>c.name!=='全部').map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
    })();

    // ===== 加载文章 =====
    (async function(){
      if(editId){
        try {
          const post = await API.getPost(editId);
          document.getElementById('pageTitle').textContent = '编辑文章';
          document.getElementById('title').value = post.title||'';
          easyMDE.value(post.content||'');
          document.getElementById('date').value = post.date||'';
          document.getElementById('cover').value = post.cover||'';
          document.getElementById('tag').value = post.tag||'';
          document.getElementById('excerpt').value = post.excerpt||'';
          document.getElementById('status').value = post.status||'draft';
          if(post.categoryId) document.getElementById('categoryId').value = post.categoryId;
          updateStats();
          if(post.cover) showCoverPreview(post.cover);
        } catch(e){ UI.toast('加载文章失败: '+e.message); }
      } else {
        document.getElementById('date').value = new Date().toISOString().substring(0,10);
      }
    })();

    // ===== 封面预览 =====
    function showCoverPreview(url){
      const preview = document.getElementById('coverPreview');
      const img = document.getElementById('coverPreviewImg');
      img.src = url;
      preview.style.display = 'block';
    }
    document.getElementById('cover').addEventListener('input', function(){
      const url = this.value.trim();
      if(url) showCoverPreview(url);
      else document.getElementById('coverPreview').style.display = 'none';
    });

    // ===== 可折叠卡片 =====
    document.querySelectorAll('[data-toggle]').forEach(head=>{
      head.addEventListener('click',()=>{
        const body = head.nextElementSibling;
        body.classList.toggle('hide');
        head.classList.toggle('collapsed');
      });
    });

    // ===== 保存 =====
    async function save(status){
      const data = {
        title: document.getElementById('title').value.trim(),
        content: easyMDE.value().trim(),
        date: document.getElementById('date').value || new Date().toISOString().substring(0,10),
        cover: document.getElementById('cover').value.trim(),
        tag: document.getElementById('tag').value.trim(),
        excerpt: document.getElementById('excerpt').value.trim(),
        categoryId: document.getElementById('categoryId').value ? +document.getElementById('categoryId').value : null,
        status: status
      };
      if(!data.title){ UI.toast('标题不能为空'); return; }
      if(!data.content){ UI.toast('正文不能为空'); return; }
      data.slug = data.title.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').toLowerCase();
      try {
        if(editId) await API.updatePost(editId, data);
        else await API.createPost(data);
        UI.toast(status==='pub'?'已发布':'已保存草稿');
        setTimeout(()=>{window.location.href='posts.html'},500);
      } catch(e){ UI.toast('保存失败: '+e.message); }
    }

    document.getElementById('publishBtn').addEventListener('click',()=>save('pub'));
    document.getElementById('saveDraftBtn').addEventListener('click',()=>save('draft'));

    // Ctrl+S 保存
    document.addEventListener('keydown', e=>{
      if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); save(document.getElementById('status').value); }
    });
  </script>
</body>
</html>
