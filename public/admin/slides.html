<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轮播管理 — 远远的天空</title>
  <link rel="stylesheet" href="../css/admin.css">
  <script src="../js/vendor/tailwind4.js"></script>
  <script src="../js/vendor/lucide.js"></script>
  <style type="text/tailwindcss">
    @theme inline {
      --color-warm-bg: var(--warm-bg); --color-warm-surface: var(--warm-surface);
      --color-warm-surface-2: var(--warm-surface-2); --color-warm-surface-3: var(--warm-surface-3);
      --color-warm-ink: var(--warm-ink); --color-warm-ink-2: var(--warm-ink-2); --color-warm-ink-3: var(--warm-ink-3);
      --color-warm-brand: var(--warm-brand); --color-warm-brand-50: var(--warm-brand-50);
      --color-warm-brand-100: var(--warm-brand-100); --color-warm-brand-300: var(--warm-brand-300);
      --color-warm-brand-500: var(--warm-brand-500); --color-warm-brand-600: var(--warm-brand-600);
      --color-warm-line: var(--warm-line);
      --color-warm-state-success: var(--warm-state-success); --color-warm-state-warning: var(--warm-state-warning);
      --color-warm-state-error: var(--warm-state-error); --color-warm-state-info: var(--warm-state-info);
      --radius-warm-md: var(--warm-radius-medium); --radius-warm-lg: var(--warm-radius-large);
    }
  </style>
  <style>
    .toggle { position: relative; display: inline-flex; align-items: center; width: 36px; height: 20px; cursor: pointer; }
    .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
    .toggle .track { width: 100%; height: 100%; border-radius: 9999px; background: var(--warm-line); transition: background 0.2s; }
    .toggle .thumb { position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 9999px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.2); transition: transform 0.2s; }
    .toggle input:checked ~ .track { background: var(--warm-brand); }
    .toggle input:checked ~ .thumb { transform: translateX(16px); }
  </style>
</head>
<body class="min-h-screen" data-page="carousel">
  <div id="sidebar-slot"></div>

  <main class="admin-main ml-[240px] min-h-screen p-8">
    <header class="mb-8 flex items-start justify-between">
      <div>
        <h1 class="text-h1 mb-1" style="color: var(--warm-ink);">轮播管理</h1>
        <p class="text-body" style="color: var(--warm-ink-2);">首页黎明区天空轮播，按排序展示</p>
      </div>
      <div class="flex items-center gap-3">
        <button id="addBtn" class="btn-secondary flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-medium">
          <i data-lucide="plus" class="w-4 h-4"></i><span>添加轮播图</span>
        </button>
        <button id="saveBtn" class="btn-primary flex items-center gap-2 px-5 py-2.5 rounded-lg text-sm font-medium">
          <i data-lucide="save" class="w-4 h-4"></i><span>保存设置</span>
        </button>
      </div>
    </header>

    <section id="slideList" class="space-y-3">
      <div class="card p-6 text-center" style="color: var(--warm-ink-3);">加载中…</div>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    if (!API.isAuthed()) window.location.href = '../login.html';

    let slides = [], posts = [];

    const esc = Admin.esc;
    const imgUrl = Admin.imgUrl;

    async function load() {
      try {
        [slides, posts] = await Promise.all([API.getSlides({ all: 1 }), API.getPosts({ all: 1 })]);
        slides.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
        render();
      } catch (e) { Admin.toast('加载失败: ' + e.message); }
    }

    function postOptions(selected) {
      return '<option value="">不关联</option>' + posts.map(p =>
        `<option value="${p.id}" ${p.id == selected ? 'selected' : ''}>${esc(p.title)}</option>`).join('');
    }

    function render() {
      const el = document.getElementById('slideList');
      if (slides.length === 0) {
        el.innerHTML = `<div class="card p-6 text-center" style="color: var(--warm-ink-3);">暂无轮播图，点击右上角「添加轮播图」</div>`;
        return;
      }
      el.innerHTML = slides.map((s, i) => {
        const img = imgUrl(s.bgImage);
        return `
        <article class="card p-5" data-idx="${i}">
          <div class="flex items-end gap-4 flex-wrap mb-4">
            <div class="w-40 flex-shrink-0">
              <label class="text-caption block mb-1" style="color: var(--warm-ink-3);">图片预览</label>
              <div class="aspect-video rounded-lg overflow-hidden" style="background: var(--warm-surface-2);">
                ${img ? `<img src="${img}" alt="${esc(s.title)}" class="w-full h-full object-cover" data-preview>` : `<div class="w-full h-full flex items-center justify-center" style="color: var(--warm-ink-3);"><i data-lucide="image" class="w-6 h-6"></i></div>`}
              </div>
            </div>
            <div class="flex-1 min-w-[200px]">
              <label class="text-caption block mb-1" style="color: var(--warm-ink-3);">图片地址</label>
              <input type="text" value="${esc(s.bgImage)}" data-field="bgImage" class="input-field w-full rounded-lg px-2.5 py-1.5 text-sm" placeholder="图片地址，如 images/hero.jpg">
            </div>
            <div class="flex flex-col">
              <label class="text-caption block mb-1 invisible">.</label>
              <button type="button" class="btn-danger inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-sm font-medium act-del">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>删除
              </button>
            </div>
          </div>
          <div class="flex items-end gap-3 flex-wrap pt-4" style="border-top: 1px solid var(--warm-line);">
            <div class="w-32">
              <label class="text-caption block mb-1" style="color: var(--warm-ink-3);">小标题</label>
              <input type="text" value="${esc(s.tag)}" data-field="tag" class="input-field w-full rounded-lg px-2.5 py-1.5 text-sm" placeholder="小标题">
            </div>
            <div class="w-40">
              <label class="text-caption block mb-1" style="color: var(--warm-ink-3);">标题</label>
              <input type="text" value="${esc(s.title)}" data-field="title" class="input-field w-full rounded-lg px-2.5 py-1.5 text-sm" placeholder="标题">
            </div>
            <div class="flex-1 min-w-[200px]">
              <label class="text-caption block mb-1" style="color: var(--warm-ink-3);">摘要</label>
              <input type="text" value="${esc(s.description)}" data-field="description" class="input-field w-full rounded-lg px-2.5 py-1.5 text-sm" placeholder="一句话概括">
            </div>
            <div class="w-44">
              <label class="text-caption block mb-1" style="color: var(--warm-ink-3);">关联文章</label>
              <select data-field="postId" class="input-field w-full rounded-lg px-2.5 py-1.5 text-sm">${postOptions(s.postId)}</select>
            </div>
            <div class="w-20">
              <label class="text-caption block mb-1" style="color: var(--warm-ink-3);">排序</label>
              <input type="number" min="0" value="${s.sortOrder ?? i + 1}" data-field="sortOrder" class="input-field w-full rounded-lg px-2.5 py-1.5 text-sm tabular-nums text-center">
            </div>
            <div class="flex flex-col items-center">
              <label class="text-caption block mb-1" style="color: var(--warm-ink-3);">启用</label>
              <label class="toggle">
                <input type="checkbox" data-field="status" ${s.status !== 'inactive' ? 'checked' : ''}>
                <span class="track"></span><span class="thumb"></span>
              </label>
            </div>
          </div>
        </article>`;
      }).join('');
      lucide.createIcons();
      bindEvents();
    }

    function bindEvents() {
      document.querySelectorAll('#slideList [data-idx]').forEach(art => {
        const idx = +art.dataset.idx;
        art.querySelectorAll('[data-field]').forEach(inp => {
          inp.oninput = () => {
            const f = inp.dataset.field;
            if (f === 'sortOrder') slides[idx].sortOrder = +inp.value || 0;
            else if (f === 'postId') slides[idx].postId = inp.value ? +inp.value : null;
            else if (f === 'status') slides[idx].status = inp.checked ? 'active' : 'inactive';
            else slides[idx][f] = inp.value;
            if (f === 'bgImage') {
              const img = art.querySelector('[data-preview]');
              const url = imgUrl(inp.value);
              if (img && url) img.src = url;
            }
          };
        });
        art.querySelector('.act-del').onclick = () => {
          if (!confirm('删除这张轮播图？')) return;
          slides.splice(idx, 1);
          render();
        };
      });
    }

    document.getElementById('addBtn').onclick = () => {
      slides.push({
        id: Date.now(), postId: null, tag: '', title: '新轮播图',
        description: '', bgImage: '', sortOrder: slides.length + 1, status: 'active'
      });
      render();
      Admin.toast('已添加，记得保存');
    };

    document.getElementById('saveBtn').onclick = async () => {
      // 清理临时 id（后端会重新分配）
      const payload = slides.map(({ id, ...rest }) => rest);
      try {
        await API.saveSlides(payload);
        Admin.toast('已保存');
        load();
      } catch (e) { Admin.toast('保存失败: ' + e.message); }
    };

    load();
  </script>
</body>
</html>
