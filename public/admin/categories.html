<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分类管理 — 远远的天空</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--sans);background:var(--cream);color:var(--day-ink);min-height:100vh;display:flex}
    a{color:inherit;text-decoration:none}
    ::selection{background:var(--gold);color:#fff}

    .sidebar{width:240px;background:var(--night-3);color:var(--night-ink);padding:32px 0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40}
    .sidebar-brand{font-family:var(--serif);font-weight:700;font-size:1.1rem;padding:0 24px 28px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:8px}
    .sidebar-brand svg{width:20px;height:20px;color:var(--gold-soft)}
    .sidebar-nav{flex:1;padding:16px 0}
    .sidebar-nav a{display:flex;align-items:center;gap:10px;padding:12px 24px;font-size:0.9rem;color:var(--text-dim);transition:all 0.2s}
    .sidebar-nav a:hover,.sidebar-nav a.active{color:#fff;background:rgba(255,255,255,0.08)}
    .sidebar-nav a.active{border-right:3px solid var(--gold)}
    .sidebar-nav svg{width:16px;height:16px;flex-shrink:0}
    .sidebar-foot{padding:16px 24px;border-top:1px solid rgba(255,255,255,0.08)}
    .sidebar-foot a{font-size:0.82rem;color:var(--text-faint);display:flex;align-items:center;gap:6px;transition:color 0.2s}
    .sidebar-foot a:hover{color:var(--gold-soft)}

    .main{margin-left:240px;flex:1;padding:40px;min-height:100vh}
    .main h1{font-family:var(--serif);font-size:1.8rem;font-weight:700;margin-bottom:28px}

    .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:100px;font-size:0.88rem;font-family:var(--sans);cursor:pointer;transition:all 0.3s;border:none}
    .btn-primary{background:var(--day-ink);color:var(--day-1)}
    .btn-primary:hover{background:var(--day-deep)}
    .btn-sm{padding:6px 14px;font-size:0.78rem}
    .btn-outline{background:transparent;border:1px solid rgba(0,0,0,0.15);color:var(--day-ink)}
    .btn-outline:hover{background:rgba(0,0,0,0.04)}
    .btn-danger{background:var(--dusk-2);color:#fff}
    .btn-danger:hover{background:var(--dusk-3)}

    table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.04);margin-bottom:24px}
    th,td{padding:14px 18px;text-align:left;font-size:0.88rem}
    th{background:var(--night-3);color:var(--night-ink);font-weight:500;font-size:0.78rem;letter-spacing:0.05em}
    td{border-bottom:1px solid rgba(0,0,0,0.05)}

    .form-row{display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap}
    .form-row input,.form-row select{padding:10px 16px;border:1px solid rgba(0,0,0,0.15);border-radius:10px;font-size:0.88rem;font-family:var(--sans);outline:none;background:#fff}
    .form-row input:focus{border-color:var(--day-deep)}

    .color-dot{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:middle}

    @media(max-width:768px){
      .sidebar{width:100%;height:auto;position:relative;padding:16px;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}
      .sidebar-brand{border:none;padding:0}
      .sidebar-nav{display:flex;flex:0;padding:0;gap:4px;overflow-x:auto}
      .sidebar-nav a{padding:8px 12px;font-size:0.78rem;border-right:none!important;white-space:nowrap}
      .sidebar-foot{display:none}
      .main{margin-left:0;padding:24px 16px}
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <a href="index.html" class="sidebar-brand">
      <svg viewBox="0 0 32 32" fill="none"><path d="M22 18a5 5 0 0 0-9.8-1.4A4 4 0 0 0 6 20.5 4.5 4.5 0 0 0 10.5 25H22a4 4 0 0 0 0-8z" fill="currentColor"></path><circle cx="24" cy="9" r="3.5" fill="currentColor" opacity="0.7"></circle></svg>
      后台管理
    </a>
    <nav class="sidebar-nav">
      <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>仪表盘</a>
      <a href="posts.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>文章管理</a>
      <a href="categories.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>分类管理</a>
      <a href="slides.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>轮播管理</a>
      <a href="config.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>站点配置</a>
    </nav>
    <div class="sidebar-foot">
      <a href="#" id="logoutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>退出</a>
      <a href="../index.html" style="margin-top:10px;display:flex;align-items:center;gap:6px">← 前台</a>
    </div>
  </aside>

  <main class="main">
    <h1>分类管理</h1>

    <div class="form-row">
      <input type="text" id="newName" placeholder="分类名称">
      <input type="text" id="newDesc" placeholder="分类描述">
      <select id="newColor">
        <option value="s1">蓝色</option><option value="s2">灰蓝</option><option value="s3">玫红</option>
        <option value="s4">橙色</option><option value="s5">金色</option><option value="s6">紫色</option><option value="s7">绿色</option>
      </select>
      <button class="btn btn-primary" id="addBtn">添加分类</button>
    </div>

    <div id="catsTable"></div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    if(!API.isAuthed()){ window.location.href = '../login.html'; }

    async function loadCats(){
      const cats = await API.getCategories();
      const el = document.getElementById('catsTable');
      el.innerHTML = `<table><thead><tr><th>名称</th><th>描述</th><th>颜色</th><th>排序</th><th>操作</th></tr></thead><tbody>
        ${cats.filter(c=>c.name!=='全部').map(c => `
          <tr>
            <td><strong>${c.name}</strong></td>
            <td>${c.description||''}</td>
            <td><span class="color-dot" style="background:${c.color==='s1'?'#4a90c2':c.color==='s2'?'#6b8aa5':c.color==='s3'?'#b8425a':c.color==='s4'?'#e8744f':c.color==='s5'?'#d4a06a':c.color==='s6'?'#8a6fa5':'#5b8a72'}"></span>${c.color}</td>
            <td>${c.sortOrder}</td>
            <td><button class="btn btn-outline btn-sm" data-edit="${c.id}">编辑</button> <button class="btn btn-danger btn-sm" data-delete="${c.id}">删除</button></td>
          </tr>`).join('')}
      </tbody></table>`;

      el.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', async ()=>{
          if(!confirm('删除分类？')) return;
          await API.deleteCategory(+btn.dataset.delete);
          UI.toast('已删除');
          loadCats();
        });
      });
    }

    loadCats();

    document.getElementById('addBtn').addEventListener('click', async ()=>{
      const name = document.getElementById('newName').value.trim();
      if(!name){ UI.toast('请输入分类名称'); return; }
      const desc = document.getElementById('newDesc').value.trim();
      const color = document.getElementById('newColor').value;
      await API.createCategory({name, description:desc, color, sortOrder:99});
      UI.toast('已添加');
      document.getElementById('newName').value = '';
      document.getElementById('newDesc').value = '';
      loadCats();
    });

    document.getElementById('logoutBtn').addEventListener('click',(e)=>{
      e.preventDefault(); API.clearToken(); window.location.href = '../login.html';
    });
  </script>
</body>
</html>
