<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分类管理 — 远远的天空</title>
  <link rel="stylesheet" href="../css/admin.css">
  <script src="../js/vendor/tailwind4.js"></script>
  <script src="../js/vendor/lucide.js"></script>
  <style type="text/tailwindcss">
    @theme inline {
      --color-warm-bg: var(--warm-bg); --color-warm-surface: var(--warm-surface);
      --color-warm-surface-2: var(--warm-surface-2); --color-warm-surface-3: var(--warm-surface-3);
      --color-warm-ink: var(--warm-ink); --color-warm-ink-2: var(--warm-ink-2); --color-warm-ink-3: var(--warm-ink-3);
      --color-warm-brand: var(--warm-brand); --color-warm-brand-50: var(--warm-brand-50);
      --color-warm-brand-100: var(--warm-brand-100); --color-warm-brand-300: var(--warm-brand-300);
      --color-warm-brand-500: var(--warm-brand-500); --color-warm-brand-600: var(--warm-brand-600);
      --color-warm-line: var(--warm-line);
      --color-warm-state-success: var(--warm-state-success); --color-warm-state-warning: var(--warm-state-warning);
      --color-warm-state-error: var(--warm-state-error); --color-warm-state-info: var(--warm-state-info);
      --radius-warm-md: var(--warm-radius-medium); --radius-warm-lg: var(--warm-radius-large);
    }
  </style>
  <style>
    .swatch { display:inline-block; width:20px; height:20px; border-radius:6px; border:1px solid rgba(0,0,0,0.1); }
    .swatch.s1 { background: linear-gradient(90deg,#4a90c2,#5b9bd5); }
    .swatch.s2 { background: linear-gradient(90deg,#6b8aa5,#7a9ab8); }
    .swatch.s3 { background: linear-gradient(90deg,#b8425a,#c1554b); }
    .swatch.s4 { background: linear-gradient(90deg,#e8744f,#ef9f6c); }
    .swatch.s5 { background: linear-gradient(90deg,#d4a06a,#c9985a); }
    .swatch.s6 { background: linear-gradient(90deg,#8a6fa5,#7a5fa0); }
    .swatch.s7 { background: linear-gradient(90deg,#5b8a72,#4a7a62); }
  </style>
</head>
<body class="min-h-screen" data-page="categories">
  <div id="sidebar-slot"></div>

  <main class="admin-main ml-[240px] min-h-screen p-8">
    <header class="mb-8 flex items-start justify-between">
      <div>
        <h1 class="text-h1 mb-1" style="color: var(--warm-ink);">分类管理</h1>
        <p class="text-body" style="color: var(--warm-ink-2);">为文章归类，分配颜色与排序</p>
      </div>
    </header>

    <div class="space-y-6 max-w-5xl">
      <!-- 新增/编辑表单 -->
      <section class="card p-6">
        <div class="flex items-center gap-2 mb-4">
          <i data-lucide="plus" class="w-4 h-4" style="color: var(--warm-brand);"></i>
          <h2 class="text-h3" style="color: var(--warm-ink);" id="formTitle">新增分类</h2>
        </div>
        <form id="catForm" class="flex flex-wrap items-end gap-4" onsubmit="return false;">
          <input type="hidden" id="editId" />
          <div class="flex-1 min-w-[160px]">
            <label class="block text-caption mb-1.5" style="color: var(--warm-ink-2);">分类名称</label>
            <input type="text" id="fName" placeholder="例如：旅行" class="input-field w-full px-3 py-2 rounded-warm-md text-sm" />
          </div>
          <div class="flex-1 min-w-[160px]">
            <label class="block text-caption mb-1.5" style="color: var(--warm-ink-2);">描述</label>
            <input type="text" id="fDesc" placeholder="一句话描述" class="input-field w-full px-3 py-2 rounded-warm-md text-sm" />
          </div>
          <div class="min-w-[140px]">
            <label class="block text-caption mb-1.5" style="color: var(--warm-ink-2);">颜色</label>
            <select id="fColor" class="input-field w-full px-3 py-2 rounded-warm-md text-sm"></select>
          </div>
          <div class="w-24">
            <label class="block text-caption mb-1.5" style="color: var(--warm-ink-2);">排序</label>
            <input type="number" id="fSort" value="1" min="0" class="input-field w-full px-3 py-2 rounded-warm-md text-sm tabular-nums" />
          </div>
          <button type="submit" id="submitBtn" class="btn-primary flex items-center gap-2 px-5 py-2 rounded-warm-md text-sm font-medium">
            <i data-lucide="save" class="w-4 h-4"></i><span>保存</span>
          </button>
          <button type="button" id="cancelBtn" class="btn-secondary hidden items-center gap-2 px-4 py-2 rounded-warm-md text-sm font-medium">
            取消
          </button>
        </form>
      </section>

      <!-- 推荐颜色 -->
      <section class="card p-6">
        <div class="flex items-center gap-2 mb-4">
          <i data-lucide="palette" class="w-4 h-4" style="color: var(--warm-brand);"></i>
          <h2 class="text-h3" style="color: var(--warm-ink);">天空色板</h2>
        </div>
        <div class="flex flex-wrap gap-3" id="palette"></div>
      </section>

      <!-- 分类列表 -->
      <section class="card p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-h3" style="color: var(--warm-ink);">分类列表</h2>
          <div class="flex items-center gap-1 text-caption" style="color: var(--warm-ink-3);">
            <i data-lucide="arrow-up-down" class="w-3.5 h-3.5"></i><span>按排序升序</span>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr style="border-bottom: 1px solid var(--warm-line);">
                <th class="text-left py-3 pr-4 font-medium" style="color: var(--warm-ink-2);">名称</th>
                <th class="text-left py-3 pr-4 font-medium" style="color: var(--warm-ink-2);">描述</th>
                <th class="text-left py-3 pr-4 font-medium" style="color: var(--warm-ink-2);">颜色</th>
                <th class="text-left py-3 pr-4 font-medium" style="color: var(--warm-ink-2);">排序</th>
                <th class="text-left py-3 pr-4 font-medium" style="color: var(--warm-ink-2);">文章数</th>
                <th class="text-left py-3 font-medium" style="color: var(--warm-ink-2);">操作</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div id="empty" class="empty-state hidden">暂无分类，在上方添加第一个</div>
      </section>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    if (!API.isAuthed()) window.location.href = '../login.html';

    const COLORS = [
      { k: 's1', label: '白昼蓝' }, { k: 's2', label: '薄雾灰蓝' },
      { k: 's3', label: '黄昏霞红' }, { k: 's4', label: '日落橙' },
      { k: 's5', label: '沙金' }, { k: 's6', label: '暮色紫' },
      { k: 's7', label: '山林绿' },
    ];
    let postCounts = {};

    function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

    // 填充颜色下拉与色板
    document.getElementById('fColor').innerHTML = COLORS.map(c => `<option value="${c.k}">${c.label}</option>`).join('');
    document.getElementById('palette').innerHTML = COLORS.map(c => `
      <button type="button" class="pick-color flex items-center gap-2 px-3 py-2 rounded-warm-md" data-color="${c.k}" style="background: var(--warm-surface-2);">
        <span class="swatch ${c.k}"></span>
        <span class="text-caption" style="color: var(--warm-ink-2);">${c.label}</span>
      </button>`).join('');
    document.querySelectorAll('.pick-color').forEach(b => b.onclick = () => {
      document.getElementById('fColor').value = b.dataset.color;
    });

    async function loadCounts() {
      const posts = await API.getPosts({ all: 1 });
      postCounts = {};
      posts.forEach(p => { if (p.categoryId) postCounts[p.categoryId] = (postCounts[p.categoryId] || 0) + 1; });
    }

    async function load() {
      try {
        await loadCounts();
        const cats = await API.getCategories();
        const list = cats.filter(c => c.name !== '全部');
        const tb = document.getElementById('rows');
        const empty = document.getElementById('empty');
        if (list.length === 0) { tb.innerHTML = ''; empty.classList.remove('hidden'); return; }
        empty.classList.add('hidden');
        tb.innerHTML = list.map(c => `
          <tr style="border-bottom: 1px solid var(--warm-line);" data-id="${c.id}">
            <td class="py-3 pr-4 font-medium" style="color: var(--warm-ink);">${esc(c.name)}</td>
            <td class="py-3 pr-4 text-caption" style="color: var(--warm-ink-2);">${esc(c.description || '-')}</td>
            <td class="py-3 pr-4">
              <div class="flex items-center gap-2">
                <span class="swatch ${c.color || 's1'}"></span>
                <span class="text-caption" style="color: var(--warm-ink-2);">${(COLORS.find(x => x.k === c.color) || {}).label || c.color || '-'}</span>
              </div>
            </td>
            <td class="py-3 pr-4 tabular-nums" style="color: var(--warm-ink);">${c.sortOrder ?? '-'}</td>
            <td class="py-3 pr-4 tabular-nums" style="color: var(--warm-ink);">${postCounts[c.id] || 0}</td>
            <td class="py-3">
              <div class="flex items-center gap-3">
                <button class="action-link flex items-center gap-1 text-caption act-edit">
                  <i data-lucide="edit-3" class="w-3.5 h-3.5"></i><span>编辑</span>
                </button>
                <button class="action-link danger flex items-center gap-1 text-caption act-del">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i><span>删除</span>
                </button>
              </div>
            </td>
          </tr>`).join('');
        lucide.createIcons();
        bindRowEvents();
      } catch (e) { Admin.toast('加载失败: ' + e.message); }
    }

    function bindRowEvents() {
      document.querySelectorAll('.act-edit').forEach(b => b.onclick = async () => {
        const id = +b.closest('tr').dataset.id;
        const cats = await API.getCategories();
        const c = cats.find(x => x.id === id);
        if (!c) return;
        document.getElementById('editId').value = c.id;
        document.getElementById('fName').value = c.name;
        document.getElementById('fDesc').value = c.description || '';
        document.getElementById('fColor').value = c.color || 's1';
        document.getElementById('fSort').value = c.sortOrder ?? 1;
        document.getElementById('formTitle').textContent = '编辑分类';
        document.getElementById('submitBtn').querySelector('span').textContent = '更新';
        document.getElementById('cancelBtn').classList.remove('hidden');
        document.getElementById('cancelBtn').classList.add('flex');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      document.querySelectorAll('.act-del').forEach(b => b.onclick = async () => {
        if (!confirm('确定删除该分类？分类下的文章将变为未分类。')) return;
        const id = +b.closest('tr').dataset.id;
        try { await API.deleteCategory(id); Admin.toast('已删除'); resetForm(); load(); }
        catch (e) { Admin.toast('删除失败: ' + e.message); }
      });
    }

    function resetForm() {
      document.getElementById('catForm').reset();
      document.getElementById('editId').value = '';
      document.getElementById('formTitle').textContent = '新增分类';
      document.getElementById('submitBtn').querySelector('span').textContent = '保存';
      document.getElementById('cancelBtn').classList.add('hidden');
      document.getElementById('cancelBtn').classList.remove('flex');
    }
    document.getElementById('cancelBtn').onclick = resetForm;

    document.getElementById('catForm').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const data = {
        name: document.getElementById('fName').value.trim(),
        description: document.getElementById('fDesc').value.trim(),
        color: document.getElementById('fColor').value,
        sortOrder: +document.getElementById('fSort').value || 1,
      };
      if (!data.name) return Admin.toast('分类名称不能为空');
      try {
        if (id) { await API.updateCategory(+id, data); Admin.toast('已更新'); }
        else { await API.createCategory(data); Admin.toast('已添加'); }
        resetForm(); load();
      } catch (err) { Admin.toast('保存失败: ' + err.message); }
    };

    load();
  </script>
</body>
</html>
