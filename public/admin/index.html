<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仪表盘 — 远远的天空</title>
  <link rel="stylesheet" href="../css/admin.css">
  <script src="../js/vendor/tailwind4.js"></script>
  <script src="../js/vendor/lucide.js"></script>
  <style type="text/tailwindcss">
    @theme inline {
      --color-warm-bg: var(--warm-bg);
      --color-warm-surface: var(--warm-surface);
      --color-warm-surface-2: var(--warm-surface-2);
      --color-warm-surface-3: var(--warm-surface-3);
      --color-warm-ink: var(--warm-ink);
      --color-warm-ink-2: var(--warm-ink-2);
      --color-warm-ink-3: var(--warm-ink-3);
      --color-warm-brand: var(--warm-brand);
      --color-warm-brand-50: var(--warm-brand-50);
      --color-warm-brand-100: var(--warm-brand-100);
      --color-warm-brand-300: var(--warm-brand-300);
      --color-warm-brand-500: var(--warm-brand-500);
      --color-warm-brand-600: var(--warm-brand-600);
      --color-warm-line: var(--warm-line);
      --color-warm-state-success: var(--warm-state-success);
      --color-warm-state-warning: var(--warm-state-warning);
      --color-warm-state-error: var(--warm-state-error);
      --color-warm-state-info: var(--warm-state-info);
      --radius-warm-md: var(--warm-radius-medium);
      --radius-warm-lg: var(--warm-radius-large);
    }
  </style>
</head>
<body class="min-h-screen" data-page="dashboard">
  <div id="sidebar-slot"></div>

  <main class="admin-main ml-[240px] min-h-screen p-8">
    <header class="mb-8 flex items-start justify-between">
      <div>
        <h1 class="text-h1 mb-1" style="color: var(--warm-ink);">仪表盘</h1>
        <p class="text-body" style="color: var(--warm-ink-2);" id="welcome">欢迎回来，天空观察员</p>
      </div>
    </header>

    <div class="space-y-8">
      <!-- KPI Cards -->
      <section id="kpi-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5"></section>

      <!-- Quick Actions + Recent -->
      <section class="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <div class="card p-5 lg:col-span-2">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-h3" style="color: var(--warm-ink);">快捷操作</h2>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <a href="editor.html" class="quick-action btn-secondary flex flex-col items-center justify-center gap-2 px-4 py-5 rounded-warm-md">
              <i data-lucide="plus" class="w-5 h-5" style="color: var(--warm-brand-600);"></i>
              <span class="text-sm" style="color: var(--warm-ink-2);">写新文章</span>
            </a>
            <a href="categories.html" class="quick-action btn-secondary flex flex-col items-center justify-center gap-2 px-4 py-5 rounded-warm-md">
              <i data-lucide="folder-open" class="w-5 h-5" style="color: var(--warm-brand-600);"></i>
              <span class="text-sm" style="color: var(--warm-ink-2);">管理分类</span>
            </a>
            <a href="slides.html" class="quick-action btn-secondary flex flex-col items-center justify-center gap-2 px-4 py-5 rounded-warm-md">
              <i data-lucide="image" class="w-5 h-5" style="color: var(--warm-brand-600);"></i>
              <span class="text-sm" style="color: var(--warm-ink-2);">轮播管理</span>
            </a>
            <a href="../index.html" class="quick-action btn-secondary flex flex-col items-center justify-center gap-2 px-4 py-5 rounded-warm-md">
              <i data-lucide="external-link" class="w-5 h-5" style="color: var(--warm-brand-600);"></i>
              <span class="text-sm" style="color: var(--warm-ink-2);">查看站点</span>
            </a>
          </div>
        </div>

        <div class="card p-5">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-h3" style="color: var(--warm-ink);">最近草稿</h2>
            <a href="posts.html" class="text-caption flex items-center gap-1" style="color: var(--warm-brand-600);">
              查看全部 <i data-lucide="arrow-right" class="w-3 h-3"></i>
            </a>
          </div>
          <ul id="recent-list" class="space-y-2">
            <li class="text-sm" style="color: var(--warm-ink-3);">加载中…</li>
          </ul>
        </div>
      </section>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    if (!API.isAuthed()) window.location.href = '../login.html';
    const esc = Admin.esc;

    (async function () {
      try {
        const [posts, cats, slides, config] = await Promise.all([
          API.getPosts({ all: 1 }),
          API.getCategories(),
          API.getSlides(),
          API.getConfig()
        ]);
        const pub = posts.filter(p => p.status === 'pub').length;
        const drafts = posts.filter(p => p.status === 'draft').length;

        if (config && config.authorName) {
          document.getElementById('welcome').textContent = '欢迎回来，' + config.authorName;
        }

        const kpis = [
          { icon: 'file-text', label: '已发布文章', value: pub },
          { icon: 'pen-tool', label: '草稿箱', value: drafts },
          { icon: 'folder-open', label: '分类数', value: cats.filter(c => c.name !== '全部').length },
          { icon: 'image', label: '轮播图', value: slides.length },
        ];
        document.getElementById('kpi-cards').innerHTML = kpis.map(k => `
          <article class="card p-5">
            <div class="flex items-start justify-between mb-4">
              <div class="w-10 h-10 rounded-warm-md kpi-icon flex items-center justify-center">
                <i data-lucide="${k.icon}" class="w-5 h-5"></i>
              </div>
            </div>
            <p class="text-caption mb-1" style="color: var(--warm-ink-2);">${k.label}</p>
            <p class="text-h2 font-semibold tabular-nums" style="color: var(--warm-ink);">${k.value}</p>
          </article>`).join('');

        const recent = posts.filter(p => p.status === 'draft').slice(0, 5);
        const ul = document.getElementById('recent-list');
        if (recent.length === 0) {
          ul.innerHTML = `<li class="text-sm" style="color: var(--warm-ink-3);">暂无草稿</li>`;
        } else {
          ul.innerHTML = recent.map(p => `
            <li class="todo-item flex items-start gap-3 p-2 rounded-warm-md cursor-pointer" onclick="location.href='editor.html?id=${p.id}'">
              <span class="mt-1.5 w-2 h-2 rounded-full flex-shrink-0" style="background: var(--warm-state-warning);"></span>
              <span class="text-sm" style="color: var(--warm-ink-2);">${esc(p.title)}</span>
            </li>`).join('');
        }
        lucide.createIcons();
      } catch (e) {
        Admin.toast('加载失败: ' + e.message);
      }
    })();
  </script>
</body>
</html>
